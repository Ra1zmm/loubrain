name: validate

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the checkout and runs checks. Without
# an explicit block the job inherits the repository default, which on older repos
# is read/write for the whole GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md has name + description frontmatter
        run: |
          f=skills/loubrain/SKILL.md
          test -f "$f"
          grep -qE '^name:[[:space:]]*loubrain[[:space:]]*$' "$f"
          grep -qE '^description:[[:space:]]*\S' "$f"

      - name: frontmatter is parseable YAML
        run: |
          # A plain (unquoted) YAML scalar cannot contain ": " -- the parser
          # reads it as a nested mapping and the whole skill fails to load.
          # Easy to reintroduce when editing prose in the description.
          python3 - <<'PY'
          import re, sys, glob
          try:
              import yaml
          except ImportError:
              yaml = None
          failed = False
          for path in ['skills/loubrain/SKILL.md', '.cursor/rules/loubrain.mdc']:
              text = open(path, encoding='utf-8').read()
              m = re.match(r'^---\r?\n(.*?)\r?\n---', text, re.S)
              if not m:
                  print(f'::error file={path}::missing frontmatter'); failed = True; continue
              block = m.group(1)
              if yaml:
                  try:
                      yaml.safe_load(block)
                  except Exception as e:
                      print(f'::error file={path}::frontmatter is not valid YAML: {e}')
                      failed = True
                      continue
              for i, line in enumerate(block.split('\n'), 1):
                  if not line or line[0].isspace() or ':' not in line:
                      continue
                  val = line.split(':', 1)[1].strip()
                  quoted = (len(val) > 1 and val[0] == val[-1] and val[0] in '"\'') or val[:1] in ('>', '|')
                  if not quoted and ': ' in val:
                      print(f'::error file={path},line={i}::unquoted ": " in a plain YAML value -- '
                            f'quote the value or replace the colon')
                      failed = True
              print(f'ok: {path}')
          sys.exit(1 if failed else 0)
          PY

      - name: evals.json is valid JSON
        run: python3 -c "import json; json.load(open('skills/loubrain/evals/evals.json'))"

      - name: hook script is ASCII-only
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' hooks/loubrain-nudge.ps1; then
            echo "::error file=hooks/loubrain-nudge.ps1::non-ASCII byte found (PowerShell 5.1 will mangle it)"
            exit 1
          fi

      - name: hook fires on build and change work, stays silent on trivial edits
        shell: pwsh
        run: |
          # Loubrain triggers on intent alone, covering new projects AND changes
          # to existing ones. Trivial contained edits must stay silent.
          $shouldFire = @(
            'build me a react dashboard',
            'create a landing page for my coffee shop',
            'improve the project',
            'refactor this codebase to use hooks',
            'lets rewrite the backend in go',
            'migrate the database to postgres',
            'add a feature for exporting to csv',
            'restructure the repo into a monorepo',
            'rewrite it from scratch',
            'this needs a major refactor'
          )
          $shouldStaySilent = @(
            'what does this stack trace mean',
            'fix the typo in the readme',
            'rename the variable foo to bar',
            'add a comment above this function',
            'create a column in this spreadsheet showing profit margin',
            'explain how promises work'
          )
          $failed = 0
          foreach ($p in $shouldFire) {
            $out = (@{prompt=$p} | ConvertTo-Json -Compress) | pwsh -NoProfile -File hooks/loubrain-nudge.ps1
            if (-not $out) { Write-Host "::error::expected FIRE but got silence: $p"; $failed++ }
          }
          foreach ($p in $shouldStaySilent) {
            $out = (@{prompt=$p} | ConvertTo-Json -Compress) | pwsh -NoProfile -File hooks/loubrain-nudge.ps1
            if ($out) { Write-Host "::error::expected SILENCE but hook fired: $p"; $failed++ }
          }
          if ($failed) { throw "$failed trigger case(s) failed" }
          Write-Host "trigger accuracy: $($shouldFire.Count + $shouldStaySilent.Count)/$($shouldFire.Count + $shouldStaySilent.Count)"

      - name: hook survives malformed input without crashing
        shell: pwsh
        run: |
          # The hook runs on every prompt, so a crash here would break the whole
          # session. It must always exit 0, whatever it is handed.
          foreach ($raw in @('', 'not json', '{}', '{"prompt":null}', '{"prompt":""}', '{"prompt":"build an app')) {
            $raw | pwsh -NoProfile -File hooks/loubrain-nudge.ps1 > $null 2>&1
            if ($LASTEXITCODE -ne 0) { throw "hook exited $LASTEXITCODE on input: $raw" }
          }
          Write-Host "hook exits 0 on all malformed inputs"

      - name: cross-tool adapters exist and stay Claude-tool-agnostic
        run: |
          for f in AGENTS.md GEMINI.md .cursor/rules/loubrain.mdc docs/PROTOCOL.md; do
            test -f "$f" || { echo "::error::missing adapter file $f"; exit 1; }
          done
          # Adapters must not reference Claude Code's own tool names -- they
          # should stay written for a generic assistant, unlike SKILL.md.
          if grep -lE '\b(AskUserQuestion|ToolSearch)\b' AGENTS.md GEMINI.md .cursor/rules/loubrain.mdc; then
            echo "::error::a cross-tool adapter references a Claude-Code-specific tool name"
            exit 1
          fi

      - name: Cursor rule has valid frontmatter
        run: |
          f=.cursor/rules/loubrain.mdc
          head -1 "$f" | grep -qx -- '---'
          grep -qE '^description:[[:space:]]*\S' "$f"

      - name: shipped .skill matches the source skill
        run: |
          # The .skill is what most people download, so it must never lag
          # behind SKILL.md. Rebuild and compare against the committed copy.
          test -f dist/loubrain.skill || { echo "::error::dist/loubrain.skill is missing"; exit 1; }
          mkdir -p /tmp/skillcheck && unzip -oq dist/loubrain.skill -d /tmp/skillcheck
          test -f /tmp/skillcheck/loubrain/SKILL.md \
            || { echo "::error::.skill must contain loubrain/SKILL.md at its root"; exit 1; }
          if ! diff -q /tmp/skillcheck/loubrain/SKILL.md skills/loubrain/SKILL.md; then
            echo "::error::dist/loubrain.skill is stale - run 'node build-skill.mjs' and commit the result"
            exit 1
          fi
          # Entry names must use forward slashes or the archive breaks on macOS/Linux
          if unzip -l dist/loubrain.skill | grep -q '\\'; then
            echo "::error::.skill contains backslash paths; rebuild with build-skill.mjs"
            exit 1
          fi

      - name: build-skill.mjs is reproducible
        run: |
          cp dist/loubrain.skill /tmp/before.skill
          node build-skill.mjs
          cmp /tmp/before.skill dist/loubrain.skill \
            || { echo "::error::rebuilding produced a different .skill than the committed one"; exit 1; }
